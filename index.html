<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>index</title>
  </head>
  <body style="-webkit-app-region: drag;background-color: #2E4252;background-color:white;">
    <div
      style="gap: 20px; border: 3px solid gray;"
      class="w-full h-full flex items-center justify-center"
    >
      <div style="font-size: 50px;letter-spacing: 2px;color: red;font-weight:600" class=" font-medium flex">
        <p id="min_data">00</p>
        :
        <p id="sec_data">00</p>
      </div>

      <div class="flex items-center justify-center gap-10">
        <button
          type="button"
          id="startBtn"
          style="padding: 8px 20px; -webkit-app-region: no-drag"
          class="rounded-lg pointer text-sm border-none text-white bg-blue"
        >
          Start
        </button>

        <button
          type="button"
          id="pauseBtn"
          style="
            width: 30px;
            height: 30px;
            display: none;
            font-size: 12px;
            -webkit-app-region: no-drag;
          "
          class="rounded-lg pointer border-none text-white bg-green"
        >
          <i class="ri-stop-fill text-xl"></i>
        </button>

        <button
          type="button"
          id="resetBtn"
          style="
            width: 30px;
            height: 30px;
            display: none;
            -webkit-app-region: no-drag;
          "
          class="pointer text-lg border-none text-white bg-blue rounded-full"
        >
          <i class="ri-restart-line"></i>
        </button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
